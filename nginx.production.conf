# Template: replace domain, certificate paths, release directory and PHP-FPM socket.
server {
    listen 80;
    server_name ideias.sua-empresa.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name ideias.sua-empresa.example;
    root /var/www/ideias/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/ideias.sua-empresa.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ideias.sua-empresa.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    charset utf-8;
    client_max_body_size 12m;
    server_tokens off;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    location ~* ^/(storage|vendor|bootstrap|config|database|resources|routes|tests)/ { return 404; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
}
